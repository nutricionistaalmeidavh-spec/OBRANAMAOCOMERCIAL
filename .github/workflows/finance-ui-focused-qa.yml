name: Financeiro Open Source UI Focused QA
on:
  push:
    branches: [feat/finance-open-source-ui-stack-20261114]
    paths:
      - '.github/workflows/finance-ui-focused-qa.yml'
      - 'apps/web/src/finance-landing/**'
      - 'apps/web/scripts/qa-artisys-finance-landing.mjs'
      - 'apps/web/scripts/generate-product-pages.mjs'
      - 'apps/web/public/sistemas/artisys-finance-island.css'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-artisys-finance-landing.mjs
