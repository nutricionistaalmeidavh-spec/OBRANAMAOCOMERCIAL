name: F13-F17 + F14-F16 Final Gate

on:
  push:
    branches:
      - integration/f13-f17-f14-f16-final

permissions:
  contents: read

env:
  DESKTOP_AUTO_RELEASE_ENABLED: 'false'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Desktop dependencies
        working-directory: apps/desktop
        run: npm install --workspaces=false --no-audit --no-fund
      - name: Lint Desktop
        working-directory: apps/desktop
        run: npm run lint
      - name: Test Desktop
        working-directory: apps/desktop
        run: npm test
      - name: Test LAN server
        run: npm --prefix apps/lan-server test
      - name: Build Desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Desktop dependencies
        run: npm install --workspaces=false --no-audit --no-fund
      - name: Test Desktop
        run: npm test
      - name: Build Desktop
        run: npm run build
      - name: Generate Apple Silicon DMG
        run: npx electron-builder --mac dmg --arm64 --publish never
      - name: Validate Apple Silicon artifact
        shell: bash
        run: |
          DMG=$(find release -maxdepth 1 -type f -name '*.dmg' | head -n 1)
          test -n "$DMG"
          hdiutil verify "$DMG"
          file "$DMG"
          shasum -a 256 "$DMG"

  web-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify admin parity registry
        run: npm run qa:admin-parity
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply obra-na-mao-comercial --local --config wrangler.jsonc
      - name: Test critical web flows
        run: npm test
      - name: Verify UX and critical assets
        run: npm run ux:verify
      - name: Verify canonical university question images
        run: npm run assets:verify
      - name: Build static application
        run: npm run build
      - name: Compile Pages Functions
        run: npx wrangler pages functions build functions --outfile .cf-pages-worker.js --external "node:*"
      - name: Bundle Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.ci.jsonc
