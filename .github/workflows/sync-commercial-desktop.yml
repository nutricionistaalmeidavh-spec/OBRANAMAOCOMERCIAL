name: Sync Commercial Desktop Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-commercial-desktop.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical MH source
        run: |
          git clone --depth 1 https://github.com/nutricionistaalmeidavh-spec/ObranaM-o-Universidade-DreFluxo.git /tmp/mh-source

      - name: Copy current Desktop and shared packages
        run: |
          rm -rf apps/desktop packages
          cp -R /tmp/mh-source/apps/desktop apps/desktop
          cp -R /tmp/mh-source/packages packages
          cp /tmp/mh-source/package.json package.json
          cp /tmp/mh-source/tsconfig.json tsconfig.json
          cp /tmp/mh-source/.nvmrc .nvmrc
          cp /tmp/mh-source/.gitignore .gitignore
          rm -rf apps/desktop/anuncio-mercado-livre
          rm -f package-lock.json

      - name: Give commercial Desktop an independent application identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('apps/desktop/package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['name'] = 'obra-na-mao-desktop-commercial'
          data['version'] = '1.0.0'
          data['description'] = 'Obra na Mão Desktop — edição comercial independente'
          build = data.setdefault('build', {})
          build['appId'] = 'br.com.obranamao.comercial.desktop'
          build['productName'] = 'Obra na Mão Desktop'
          build.setdefault('win', {})['artifactName'] = 'Obra-na-Mao-Desktop-Setup-${version}.${ext}'
          build.setdefault('nsis', {})['shortcutName'] = 'Obra na Mão Desktop'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          root = Path('package.json')
          root_data = json.loads(root.read_text(encoding='utf-8'))
          root_data['name'] = 'obra-na-mao-comercial'
          root_data['description'] = 'Monorepo comercial independente do Obra na Mão'
          root.write_text(json.dumps(root_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove one-time sync workflow
        run: rm -f .github/workflows/sync-commercial-desktop.yml

      - name: Commit commercial baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(desktop): sync canonical desktop into commercial product"
          git push origin main
