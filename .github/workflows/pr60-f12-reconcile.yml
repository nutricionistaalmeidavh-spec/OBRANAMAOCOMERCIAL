name: PR60 F12 Reconcile

permissions:
  contents: write

on:
  push:
    branches: [feat/desktop-lan-server-foundation]
    paths:
      - '.github/workflows/pr60-f12-reconcile.yml'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-lan-server-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reconcile F12 runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const mainPath = 'apps/desktop/electron/main.cjs'
          let main = fs.readFileSync(mainPath, 'utf8')
          const once = (text, before, after, label) => {
            if (!text.includes(before)) throw new Error(`Pattern not found: ${label}`)
            return text.replace(before, after)
          }
          if (!main.includes("require('./services/rh-document-service.cjs')")) {
            main = once(main,
              "const { RhSourceService } = require('./services/rh-source-service.cjs')",
              "const { RhSourceService } = require('./services/rh-source-service.cjs')\nconst { RhDocumentService } = require('./services/rh-document-service.cjs')",
              'RhDocumentService import')
          }
          if (!main.includes('const rhDocuments = new RhDocumentService')) {
            main = once(main,
              "  const rh = new RhSourceService({ localPayroll, localTime, lanClient: dataAccess.remote, moduleStorage })",
              "  const rh = new RhSourceService({ localPayroll, localTime, lanClient: dataAccess.remote, moduleStorage })\n  const rhDocuments = new RhDocumentService({ rh, localTime, fileService: files, dataAccess })\n  const time = {\n    get: payload => rh.timeGet(payload),\n    autoFill: payload => rh.timeAutoFill(payload),\n    save: payload => rh.timeSave(payload),\n    generateDocuments: payload => rhDocuments.generateDocuments(payload),\n    generateForAll: payload => rhDocuments.generateForAll(payload)\n  }",
              'RH document runtime')
          }
          main = main.replace('    time: rh,', '    time,')
          fs.writeFileSync(mainPath, main)

          const timePath = 'apps/desktop/electron/services/time-service.cjs'
          let timeService = fs.readFileSync(timePath, 'utf8')
          if (timeService.includes('  externalContext(context){')) {
            const before = timeService
            timeService = timeService.replace(/\n  externalContext\(context\)\{[\s\S]*?\n  async generateDocuments\(payload\)\{/, '\n  async generateDocuments(payload){')
            if (timeService === before) throw new Error('Could not remove duplicate central generation block from TimeService')
            fs.writeFileSync(timePath, timeService)
          }
          NODE
      - name: Syntax checks
        run: |
          node --check apps/desktop/electron/main.cjs
          node --check apps/desktop/electron/services/rh-source-service.cjs
          node --check apps/desktop/electron/services/rh-document-service.cjs
          node --check apps/desktop/electron/services/time-service.cjs
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/electron/main.cjs apps/desktop/electron/services/time-service.cjs
          git commit -m "refactor(f12): route RH documents through derived-output service"
          git push origin HEAD:feat/desktop-lan-server-foundation
