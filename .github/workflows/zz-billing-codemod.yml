name: Temporary billing codemod

on:
  push:
    branches: [feat/billing-license-stages-2-6]

permissions:
  contents: write

jobs:
  patch-billing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/billing-license-stages-2-6
      - name: Apply deterministic billing integration patch
        shell: python
        run: |
          from pathlib import Path
          def replace_once(path, old, new):
            p=Path(path); s=p.read_text(); count=s.count(old)
            if count!=1: raise SystemExit(f'{path}: expected 1 match, got {count}: {old[:120]}')
            p.write_text(s.replace(old,new,1))

          sdk='apps/web/cloudflare/sdk.ts'
          replace_once(sdk,
            "  GEMINI_API_KEY?: string;\n  OWNER_EMAIL?: string;",
            "  GEMINI_API_KEY?: string;\n  ASAAS_API_KEY?: string;\n  ASAAS_API_BASE_URL?: string;\n  ASAAS_WEBHOOK_TOKEN?: string;\n  OWNER_EMAIL?: string;"
          )
          replace_once(sdk,
            "    'POST /api/bootstrap/claim':{scope:'bootstrap-claim',limit:8,windowSeconds:900},",
            "    'POST /api/bootstrap/claim':{scope:'bootstrap-claim',limit:8,windowSeconds:900},\n    'POST /api/billing/checkout':{scope:'billing-checkout',limit:8,windowSeconds:900},"
          )

          index='apps/web/backend/index.ts'
          replace_once(index,
            "import { canUseFinanceAi } from './authorization-policy';",
            "import { canUseFinanceAi } from './authorization-policy';\nimport { BILLING_ROUTES } from './billing-routes';\nimport { LicenseConflictError, createLicense as createManagedLicense, getLicense as getManagedLicense, mutateLicense as mutateManagedLicense } from './license-service';"
          )
          replace_once(index,
            "  ...EDUCATION_ROUTES,",
            "  ...BILLING_ROUTES,\n  ...EDUCATION_ROUTES,"
          )

          old="'POST /api/owner/licenses':[...ownerSecured,async(ctx)=>{const body=asRecord(ctx.body),email=norm(String(body.email||''))||undefined,modules=asArray(body.modules).map(String).filter(x=>MODULES.includes(x)),channels=asArray(body.channels).map(String).filter(x=>CHANNELS.includes(x)),expiresAt=String(body.expiresAt||'').trim()||undefined,note=String(body.note||'').trim()||undefined,plan=String(body.plan||'custom').slice(0,40),maxUsers=Math.max(1,Math.min(999,Math.floor(Number(body.maxUsers||10)))),maxProjects=Math.max(1,Math.min(999,Math.floor(Number(body.maxProjects||5)))),maxDevices=Math.max(1,Math.min(999,Math.floor(Number(body.maxDevices||2))));if(!modules.length)return error('Selecione ao menos um módulo.',400);if(!channels.length)return error('Selecione Desktop e/ou Mobile.',400);const lic:License={email,code:newLicenseCode(),modules,channels,status:'active',expiresAt,note,plan,maxUsers,maxProjects,maxDevices,createdAt:now(),updatedAt:now()};const [id]=await db.add('licenses',[lic as unknown as Record<string,unknown>]);if(!id)return error('Não foi possível criar a licença.',500);await indexLicense(id,lic);return json({license:{...lic,id}},201)}],"
          new="'POST /api/owner/licenses':[...ownerSecured,async(ctx)=>{const body=asRecord(ctx.body),email=norm(String(body.email||''))||undefined,modules=asArray(body.modules).map(String).filter(x=>MODULES.includes(x)),channels=asArray(body.channels).map(String).filter(x=>CHANNELS.includes(x)),expiresAt=String(body.expiresAt||'').trim()||undefined,note=String(body.note||'').trim()||undefined,plan=String(body.plan||'custom').slice(0,40),maxUsers=Math.max(1,Math.min(999,Math.floor(Number(body.maxUsers||10)))),maxProjects=Math.max(1,Math.min(999,Math.floor(Number(body.maxProjects||5)))),maxDevices=Math.max(1,Math.min(999,Math.floor(Number(body.maxDevices||2))));if(!modules.length)return error('Selecione ao menos um módulo.',400);if(!channels.length)return error('Selecione Desktop e/ou Mobile.',400);try{const lic=await createManagedLicense({email,modules,channels,status:'active',expiresAt,note,plan,maxUsers,maxProjects,maxDevices},{source:'manual',userId:ctx.user!.userId,email:ctx.user!.email});return json({license:lic},201)}catch(e){return error((e as Error).message||'Não foi possível criar a licença.',500)}}],"
          replace_once(index,old,new)

          old="'PUT /api/owner/licenses/:id':[...ownerSecured,async(ctx)=>{const lic=await getLicense(ctx.params.id);if(!lic)return error('Licença não encontrada.',404);const body=asRecord(ctx.body),modules=asArray(body.modules).map(String).filter(x=>MODULES.includes(x)),channels=asArray(body.channels).map(String).filter(x=>CHANNELS.includes(x)),status=String(body.status||lic.status)==='revoked'?'revoked':'active',expiresAt=String(body.expiresAt||'').trim()||undefined,note=String(body.note||'').trim()||undefined,plan=String(body.plan||lic.plan||'custom').slice(0,40),oldLimits=licenseLimits(lic as unknown as Record<string,unknown>),maxUsers=Math.max(1,Math.min(999,Math.floor(Number(body.maxUsers||oldLimits.maxUsers)))),maxProjects=Math.max(1,Math.min(999,Math.floor(Number(body.maxProjects||oldLimits.maxProjects)))),maxDevices=Math.max(1,Math.min(999,Math.floor(Number(body.maxDevices||oldLimits.maxDevices))));if(!modules.length||!channels.length)return error('Módulos e canais são obrigatórios.',400);const next={...lic,modules,channels,status,expiresAt,note,plan,maxUsers,maxProjects,maxDevices,updatedAt:now()};await db.update('licenses',[{id:lic.id!,record:next as unknown as Record<string,unknown>}]);return json({license:next})}],"
          new="'PUT /api/owner/licenses/:id':[...ownerSecured,async(ctx)=>{const lic=await getManagedLicense(ctx.params.id);if(!lic)return error('Licença não encontrada.',404);const body=asRecord(ctx.body),modules=asArray(body.modules).map(String).filter(x=>MODULES.includes(x)),channels=asArray(body.channels).map(String).filter(x=>CHANNELS.includes(x)),status=String(body.status||lic.status)==='revoked'?'revoked':'active',expiresAt=String(body.expiresAt||'').trim()||undefined,note=String(body.note||'').trim()||undefined,plan=String(body.plan||lic.plan||'custom').slice(0,40),oldLimits=licenseLimits(lic as unknown as Record<string,unknown>),maxUsers=Math.max(1,Math.min(999,Math.floor(Number(body.maxUsers||oldLimits.maxUsers)))),maxProjects=Math.max(1,Math.min(999,Math.floor(Number(body.maxProjects||oldLimits.maxProjects)))),maxDevices=Math.max(1,Math.min(999,Math.floor(Number(body.maxDevices||oldLimits.maxDevices))));if(!modules.length||!channels.length)return error('Módulos e canais são obrigatórios.',400);try{const next=await mutateManagedLicense(lic.id!,current=>({...current,modules,channels,status,expiresAt,note,plan,maxUsers,maxProjects,maxDevices}),{source:'manual',userId:ctx.user!.userId,email:ctx.user!.email},'manual_updated');return json({license:next})}catch(e){return error((e as Error).message,e instanceof LicenseConflictError?409:500)}}],"
          replace_once(index,old,new)

          old="if(lic?.companyId)return error('Esta licença já está vinculada a uma operação.',409);const body=asRecord(ctx.body),companyName=String(body.companyName||'').trim(),projectName=String(body.projectName||'').trim(),customer=String(body.customer||'').trim();if(!companyName||!projectName)return error('Informe empresa e obra.',400);const [companyId]=await db.add('companies',[{name:companyName,createdAt:now(),createdBy:ctx.user!.userId,tenantVersion:1,attendanceTimesheetMode:'disabled',licenseId:lic?.id||'owner',licensedModules:lic?.modules||MODULES,licensedChannels:lic?.channels||CHANNELS}]);if(!companyId)return error('Não foi possível criar a empresa.',500);"
          new="const body=asRecord(ctx.body),companyName=String(body.companyName||'').trim(),projectName=String(body.projectName||'').trim(),customer=String(body.customer||'').trim();if(!projectName||(!lic?.companyId&&!companyName))return error('Informe empresa e obra.',400);let companyId=lic?.companyId;if(companyId){const existingCompany=await getCompany(companyId);if(!existingCompany||String(existingCompany.createdBy||'')!==ctx.user!.userId)return error('A empresa vinculada à licença não pertence a esta conta.',403)}else{const [createdCompanyId]=await db.add('companies',[{name:companyName,createdAt:now(),createdBy:ctx.user!.userId,tenantVersion:1,attendanceTimesheetMode:'disabled',licenseId:lic?.id||'owner',licensedModules:lic?.modules||MODULES,licensedChannels:lic?.channels||CHANNELS}]);companyId=createdCompanyId||undefined}if(!companyId)return error('Não foi possível criar a empresa.',500);"
          replace_once(index,old,new)

          old="if(lic?.id)await db.update('licenses',[{id:lic.id,record:{...lic,claimedBy:ctx.user!.userId,companyId,updatedAt:now()} as unknown as Record<string,unknown>}]);await audit(member,ctx.user!,'tenant_created'"
          new="if(lic?.id)await mutateManagedLicense(lic.id,current=>({...current,claimedBy:ctx.user!.userId,companyId}),{source:'system',userId:ctx.user!.userId,email:ctx.user!.email},'tenant_claimed');await audit(member,ctx.user!,'tenant_created'"
          replace_once(index,old,new)

      - name: Commit integration patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/backend/index.ts apps/web/cloudflare/sdk.ts
          git diff --cached --check
          git commit -m "feat(billing): wire shared license and checkout routes"
          git push origin HEAD:feat/billing-license-stages-2-6
