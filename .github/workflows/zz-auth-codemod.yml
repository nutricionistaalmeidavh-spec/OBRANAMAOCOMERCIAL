name: Temporary auth codemod

on:
  push:
    branches: [feat/unify-license-access]

permissions:
  contents: write

jobs:
  patch-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unify-license-access
      - name: Apply deterministic entitlement hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
            p = Path(path)
            s = p.read_text()
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:140]}')
            p.write_text(s.replace(old, new, 1))

          index = 'apps/web/backend/index.ts'
          replace_once(
            index,
            "const entitlement=await memberEntitlements(member);if(!isOwner&&!entitlement.modules.includes('finance'))return null;const platform=await ensurePlatformAccessForMember({email:member.email||user.email||'',name:member.name||user.name,companyId:member.companyId,projectId:member.projectId,employeeId:member.employeeId,role:member.role,modules:entitlement.modules,isSuperadmin:isOwner||member.canonicalOwner===true});if(platform.status!=='active'||!platform.systems.finance.enabled)return null;",
            "const entitlement=await memberEntitlements(member),companyAccess=await companyEntitlements(member.companyId);if(!isOwner&&(!companyAccess||!companyAccess.modules.includes('finance')))return null;const platform=await ensurePlatformAccessForMember({email:member.email||user.email||'',name:member.name||user.name,companyId:member.companyId,projectId:member.projectId,employeeId:member.employeeId,role:member.role,modules:entitlement.modules,isSuperadmin:isOwner||member.canonicalOwner===true});if(platform.status!=='active'||!platform.systems.finance.enabled)return null;"
          )
          replace_once(
            index,
            "const entitlement=await memberEntitlements(member);if(!isOwner&&!entitlement.modules.length)return null;const platform=await ensurePlatformAccessForMember({email:member.email||user.email||'',name:member.name||user.name,companyId:member.companyId,projectId:member.projectId,employeeId:member.employeeId,role:member.role,modules:entitlement.modules,isSuperadmin:isOwner||member.canonicalOwner===true});if(platform.status!=='active')return null;const systems=structuredClone(platform.systems);if(!isOwner){systems.finance.enabled=systems.finance.enabled&&entitlement.modules.includes('finance');systems.obra360.enabled=systems.obra360.enabled&&entitlement.modules.includes('obra360');systems.universidade.enabled=systems.universidade.enabled&&entitlement.modules.includes('universidade')}const company=await getCompany(member.companyId),project=await getProject(member.projectId);return{userId:user.userId,email:user.email,platformRole:platform.platformRole,role:member.role,companyId:member.companyId,companyName:String(company?.name||'Empresa'),projectId:member.projectId,projectName:String(project?.name||'Obra'),employeeId:member.employeeId,systems,channels:entitlement.channels,modules:entitlement.modules}",
            "const entitlement=await memberEntitlements(member),companyAccess=await companyEntitlements(member.companyId);if(!isOwner&&(!companyAccess||!companyAccess.modules.length))return null;const platform=await ensurePlatformAccessForMember({email:member.email||user.email||'',name:member.name||user.name,companyId:member.companyId,projectId:member.projectId,employeeId:member.employeeId,role:member.role,modules:entitlement.modules,isSuperadmin:isOwner||member.canonicalOwner===true});if(platform.status!=='active')return null;const systems=structuredClone(platform.systems);if(!isOwner){systems.finance.enabled=systems.finance.enabled&&!!companyAccess?.modules.includes('finance');systems.obra360.enabled=systems.obra360.enabled&&!!companyAccess?.modules.includes('obra360');systems.universidade.enabled=systems.universidade.enabled&&!!companyAccess?.modules.includes('universidade')}const company=await getCompany(member.companyId),project=await getProject(member.projectId);return{userId:user.userId,email:user.email,platformRole:platform.platformRole,role:member.role,companyId:member.companyId,companyName:String(company?.name||'Empresa'),projectId:member.projectId,projectName:String(project?.name||'Obra'),employeeId:member.employeeId,systems,channels:entitlement.channels,modules:entitlement.modules}"
          )
          replace_once(
            index,
            "if(access.status!=='active'||!access.systems.universidade.enabled||!(await memberEntitlements(member)).modules.includes('universidade'))return error('Universidade não liberada para esta credencial.',403);",
            "const companyAccess=await companyEntitlements(member.companyId);if(access.status!=='active'||!access.systems.universidade.enabled||!companyAccess?.modules.includes('universidade'))return error('Universidade não liberada para esta credencial.',403);"
          )
          replace_once(
            index,
            "if(!session||!session.device.companyId)return error('Desktop sem empresa vinculada.',403);const explicitAdmin=norm(session.device.email)===ownerEmail();if(!canUseFinanceAi({licenseActive:session.access.status==='active',licenseModules:session.access.modules,isExplicitAdmin:explicitAdmin}))return error('IA Financeira não está liberada para esta licença.',403);try{const output=await desktopAiAnalyze(session.device.companyId,body);",
            "if(!session||!session.device.companyId)return error('Desktop sem empresa vinculada.',403);const explicitAdmin=norm(session.device.email)===ownerEmail(),companyAccess=await companyEntitlements(session.device.companyId),individualFinance=explicitAdmin||session.access.modules.includes('finance'),licenseActive=!!companyAccess&&companyAccess.status==='active'&&(!companyAccess.expiresAt||companyAccess.expiresAt>=now());if(!individualFinance||!canUseFinanceAi({licenseActive,licenseModules:companyAccess?.modules||[],isExplicitAdmin:explicitAdmin}))return error('IA Financeira não está liberada para esta licença.',403);try{const output=await desktopAiAnalyze(session.device.companyId,body);"
          )
          replace_once(
            'apps/web/backend/platform-access.ts',
            "const email=norm(input.email),isSuperadmin=input.isSuperadmin===true||email===superadminEmail();",
            "const email=norm(input.email),isSuperadmin=email===superadminEmail();"
          )
      - name: Commit hardening patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/backend/index.ts apps/web/backend/platform-access.ts
          git diff --cached --check
          git commit -m "security(auth): bind access to current company entitlement"
          git push origin HEAD:feat/unify-license-access
