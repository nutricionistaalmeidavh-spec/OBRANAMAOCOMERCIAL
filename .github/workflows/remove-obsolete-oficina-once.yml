name: Remove obsolete Oficina catalog card once

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/sistemas/marketplace-feed.js'
      - 'apps/web/public/sistemas/marketplace-collection.js'
      - 'apps/web/src/catalog-marketplace-hide-legacy.test.ts'
      - '.github/workflows/remove-obsolete-oficina-once.yml'

permissions:
  contents: read

concurrency:
  group: artisys-commercial-publish
  cancel-in-progress: false

jobs:
  validate-and-publish-once:
    if: ${{ contains(github.event.head_commit.message, '[oficina-catalog-remove-once]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify removed item cannot return through the Mercado Livre feed
        run: npx vitest run src/catalog-marketplace-hide-legacy.test.ts
      - name: Verify catalog invariants and build static assets
        run: npm run build
      - name: Check Worker build without changing production
        run: npx wrangler deploy --dry-run --config wrangler.ci.jsonc
      - name: Require existing production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare token unavailable"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account ID unavailable"; exit 1; }
      - name: Publish existing commercial Worker with updated static assets
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Confirm published filtering logic, Holerites and Oficina pages
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const paths = [
            ['/sistemas/marketplace-feed.js', 'MLB7417818080'],
            ['/sistemas/marketplace-collection.js', 'isRemovedSiteItem'],
            ['/oficina/', 'ArtiSys Oficina'],
            ['/gest%C3%A3oholerites/', 'ArtiSys Holerites']
          ];
          for (const [path, expected] of paths) {
            let found = false;
            for (let n = 0; n < 8; n++) {
              const response = await fetch('https://artisys.dev'+path, {cache:'no-store'});
              if (response.ok && (await response.text()).includes(expected)) {found = true; break;}
              await new Promise(resolve=>setTimeout(resolve, 3500));
            }
            assert.ok(found, 'Production check failed: '+path);
          }
          JS
