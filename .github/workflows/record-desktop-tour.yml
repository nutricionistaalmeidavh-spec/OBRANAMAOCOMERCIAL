name: Record desktop tour

on:
  push:
    branches:
      - chore/record-desktop-tour
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies in isolated runner
        working-directory: apps/desktop
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install recorder tooling and Electron Chromium
        working-directory: apps/desktop
        run: |
          unset ELECTRON_SKIP_BINARY_DOWNLOAD
          npm install --no-save --no-audit --no-fund --legacy-peer-deps playwright electron@43.4.1 react-is@19 @electron/rebuild
          node -e "const p=require('electron'); console.log('Electron:',p); if(!p || !require('fs').existsSync(p)) process.exit(1)"
          node -e "console.log('react-is:',require.resolve('react-is'))"
          npx electron-rebuild -f -w better-sqlite3 -v 43.4.1
          npx playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Run real Chromium/Electron tour
        working-directory: apps/desktop
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24 -ac +extension RANDR" bash -lc '
            rm -rf node_modules/.vite
            npm run dev -- --host 127.0.0.1 > /tmp/artisys-vite.log 2>&1 &
            VITE_PID=$!
            npx wait-on http://127.0.0.1:5173
            node scripts/record-desktop-tour.mjs
            STATUS=$?
            kill $VITE_PID || true
            cat /tmp/artisys-vite.log || true
            exit $STATUS
          '

      - name: Upload tour video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artisys-desktop-tour-real
          path: |
            apps/desktop/tour-output/*.mp4
            apps/desktop/tour-output/*.json
          if-no-files-found: warn
          retention-days: 7
