name: Commercial Desktop Windows CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.github/workflows/commercial-desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Desktop dependencies
        working-directory: apps/desktop
        run: npm install --workspaces=false --no-audit --no-fund
      - name: Test Desktop
        working-directory: apps/desktop
        run: npm test
      - name: Build Desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist
      - name: Resolve Desktop version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Obra-na-Mao-Desktop-Commercial-${{ env.DESKTOP_VERSION }}-Windows
          path: apps/desktop/release/Obra-na-Mao-Desktop-Setup-${{ env.DESKTOP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-commercial-v$env:DESKTOP_VERSION"
          $asset = "apps/desktop/release/Obra-na-Mao-Desktop-Setup-$env:DESKTOP_VERSION.exe"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Obra na Mão Desktop Comercial v$env:DESKTOP_VERSION" --notes "Instalador Windows da edição comercial validado pelo CI."
          } else {
            gh release upload $tag $asset --repo "${{ github.repository }}" --clobber
          }
