name: Commercial Desktop Windows CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.github/workflows/commercial-desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/commercial-desktop-ci.yml'

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Desktop dependencies
        working-directory: apps/desktop
        run: npm install --workspaces=false --no-audit --no-fund
      - name: Test Desktop
        working-directory: apps/desktop
        run: npm test
      - name: Build Desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist
      - name: Resolve Desktop version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Verify updater artifacts
        shell: pwsh
        run: |
          $release = "apps/desktop/release"
          $required = @(
            "$release/Obra-na-Mao-Desktop-Setup-$env:DESKTOP_VERSION.exe",
            "$release/Obra-na-Mao-Desktop-Setup-$env:DESKTOP_VERSION.exe.blockmap",
            "$release/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Updater artifact missing: $file" }
          }
      - name: Upload installer and updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: Obra-na-Mao-Desktop-Commercial-${{ env.DESKTOP_VERSION }}-Windows
          path: |
            apps/desktop/release/Obra-na-Mao-Desktop-Setup-${{ env.DESKTOP_VERSION }}.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-commercial-v$env:DESKTOP_VERSION"
          $release = "apps/desktop/release"
          $assets = @(
            "$release/Obra-na-Mao-Desktop-Setup-$env:DESKTOP_VERSION.exe",
            "$release/Obra-na-Mao-Desktop-Setup-$env:DESKTOP_VERSION.exe.blockmap",
            "$release/latest.yml"
          )
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Obra na Mão Desktop Comercial v$env:DESKTOP_VERSION" --notes "Instalador Windows e metadados de atualização automática validados pelo CI."
          } else {
            gh release upload $tag $assets --repo "${{ github.repository }}" --clobber
          }

  qa-demo-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install and build Desktop
        working-directory: apps/desktop
        run: |
          npm install --workspaces=false --no-audit --no-fund
          npm run build
      - name: Install QA runtime and Linux capture dependencies
        run: |
          npm install --prefix qa/runtime --no-audit --no-fund
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg xvfb
          npx --prefix qa/runtime playwright install-deps chromium
      - name: Capture real Electron quick demo
        env:
          OBRA_NA_MAO_DATA_DIR: ${{ runner.temp }}/obra-na-mao-artisys-demo
        run: |
          rm -rf "$OBRA_NA_MAO_DATA_DIR"
          xvfb-run -a node qa/runtime/artisys-qa.mjs demo \
            --config qa/artisys-qa.config.json \
            --demo quick-30s \
            --preset reels-9x16 \
            --environment ci \
            --output qa-artifacts
      - name: Verify 30s Reels media
        run: |
          VIDEO="$(find qa-artifacts -name demo-video.mp4 -print -quit)"
          test -n "$VIDEO"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$VIDEO")" = "1080x1920"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          awk -v d="$DURATION" 'BEGIN { exit (d >= 29.8 && d <= 30.2) ? 0 : 1 }'
      - name: Upload demo validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obra-na-mao-demo-validation-${{ github.run_number }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
