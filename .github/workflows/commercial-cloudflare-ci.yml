name: Commercial Cloudflare CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/**'
      - 'apps/web/**'
      - '.github/workflows/commercial-cloudflare-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/**'
      - 'apps/web/**'
      - '.github/workflows/commercial-cloudflare-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply obra-na-mao-comercial --local --config wrangler.jsonc
      - name: Test critical web flows
        run: npm test
      - name: Verify UX and critical assets
        run: npm run ux:verify
      - name: Verify canonical university question images
        run: npm run assets:verify
      - name: Build static application
        run: npm run build
      - name: Compile Pages Functions
        run: npx wrangler pages functions build functions --outfile .cf-pages-worker.js --external "node:*"
      - name: Bundle Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.ci.jsonc

  production-migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply remote D1 migrations when credentials are available
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare CI credentials are not configured; production smoke will still verify the real persisted D1 schema."
            exit 0
          fi
          npx wrangler d1 migrations apply obra-na-mao-comercial --remote --config wrangler.jsonc
          npx wrangler d1 migrations list obra-na-mao-comercial --remote --config wrangler.jsonc

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, production-migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployed commit and smoke production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_WAIT_MS: '360000'
        run: node scripts/smoke-production.mjs
