name: Commercial Cloudflare CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/commercial-cloudflare-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure canonical university question images
        shell: bash
        run: |
          set -euo pipefail
          image_count=0
          if [ -d public/question-images ]; then
            image_count="$(find public/question-images -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          fi
          if [ ! -f public/resources/question-visual-map.json ] || [ "$image_count" -ne 549 ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "Canonical assets are not committed yet; running one-time migration."
              npm run assets:migrate
            else
              echo "Canonical 549-image asset set is missing. Run npm run assets:migrate and commit the generated assets."
              exit 1
            fi
          fi
          npm run assets:verify
      - name: Persist canonical university assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- public/question-images public/resources/question-visual-map.json public/resources/question-visuals-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/question-images public/resources/question-visual-map.json public/resources/question-visuals-manifest.json
            git commit -m "chore(university): materialize canonical 549 question images"
            git push origin HEAD:main
          fi
      - name: Build static application
        run: npm run build
      - name: Compile Pages Functions
        run: npx wrangler pages functions build functions --outfile .cf-pages-worker.js --external "node:*"
      - name: Bundle Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.ci.jsonc
