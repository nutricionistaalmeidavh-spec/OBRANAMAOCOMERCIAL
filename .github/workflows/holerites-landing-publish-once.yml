name: Publish ArtiSys Holerites landing once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/holerites-landing-publish-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/holerites-landing-publish-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Holerites landing and commercial invariants
        run: |
          npx vitest run src/holerites-landing.test.ts
          npm run catalog:verify
      - name: Build current site with local static assets
        run: npm run build
      - name: Dry-run full Worker compilation
        run: npx wrangler deploy --dry-run --config wrangler.ci.jsonc

  publish-once:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[holerites-landing-publish-once]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require existing Cloudflare deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Existing Cloudflare deployment credentials unavailable. Nothing was published."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Deploy existing Worker and local static assets (no migrations or secret edits)
        run: npm run worker:deploy
      - name: Confirm Holerites landing and screenshots are publicly accessible
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          let last;
          const base='https://artisys.dev/gest%C3%A3oholerites/';
          for(let attempt=1;attempt<=12;attempt++){
            try{
              const response=await fetch(base,{cache:'no-store',signal:AbortSignal.timeout(15000)});
              assert.equal(response.status,200,'Landing page must return 200');
              const html=await response.text();
              assert.match(html,/ArtiSys Holerites/);
              assert.match(html,/holerites-dashboard-real\.webp/);
              assert.match(html,/holerite-impresso-real\.webp/);
              const img=await fetch(base+'media/holerites-dashboard-real.webp',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              assert.equal(img.status,200,'Real screenshot must return 200');
              assert.match(img.headers.get('content-type')||'',/image\/webp/);
              console.log('Holerites page and real screenshot verified live');
              process.exit(0);
            }catch(error){last=error;console.warn('Verification '+attempt+'/12:',error.message);if(attempt<12)await new Promise(resolve=>setTimeout(resolve,5000));}
          }
          throw last;
          JS
