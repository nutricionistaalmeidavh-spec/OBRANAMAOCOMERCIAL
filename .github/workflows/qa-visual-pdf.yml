name: QA Visual Completo - PDF (somente ambiente ficticio)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'qa/**'
      - '.github/workflows/qa-visual-pdf.yml'
permissions:
  contents: read
jobs:
  capturar-telas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      ARTISYS_QA: '1'
      OBRA_NA_MAO_DATA_DIR: ${{ runner.temp }}/qa-visual-obranamao-${{ github.run_id }}
      QA_VISUAL_OUT: qa-artifacts/visual-catalog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Dependencies Desktop
        working-directory: apps/desktop
        run: npm install --workspaces=false --no-audit --no-fund
      - name: Validar e compilar Desktop
        working-directory: apps/desktop
        run: |
          npm run lint
          npm run build
      - name: Dependencies QA
        run: npm install --prefix qa/runtime --no-audit --no-fund
      - name: Libs de interface grafica para Electron
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Capturar rotas, interacoes e gerar PDF
        run: xvfb-run -a node qa/scripts/capture-full-catalog.mjs
      - name: Publicar PDF, prints e manifest mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obra-na-mao-qa-visual-pdf-${{ github.run_number }}
          path: qa-artifacts/visual-catalog/
          if-no-files-found: warn
          retention-days: 7
